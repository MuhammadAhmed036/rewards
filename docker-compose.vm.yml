
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loyalty_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: loyalty_db
    ports:
      - "5434:5432"
    volumes:
      - loyalty_vm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty_app -d loyalty_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # No real SMTP provider is configured for this lab, so outgoing mail (sign-in codes, password
  # resets, welcome emails) is caught here instead of actually being sent. Open the web UI on
  # port 8025 to read them.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://loyalty_app:${POSTGRES_PASSWORD}@postgres:5432/loyalty_db
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Rappio}
      AUTH_SECRET: ${AUTH_SECRET}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM_TRANSACTIONAL: no-reply@${APP_DOMAIN:-example.com}

  # Terminates HTTPS so the app's session cookies (Secure, __Host- prefixed) actually get stored
  # by the browser. The app itself is no longer published directly — everything goes through here.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - loyalty_vm_caddy_data:/data

  # Vercel's own cron scheduler normally triggers the jobs in vercel.json; this does the same
  # job on the same UTC schedule when running outside Vercel.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - ./vm-cron.sh:/vm-cron.sh:ro
    # Invoke via `sh vm-cron.sh` rather than executing it directly — a file bind-mounted from the
    # host doesn't reliably keep its executable bit across checkouts/platforms, this does either way.
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && exec sh /vm-cron.sh"]

volumes:
  loyalty_vm_pgdata:
  loyalty_vm_caddy_data:
